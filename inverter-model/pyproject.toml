[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invertermodel"
version = "0.1.0"
description = "Time-domain simulation of a grid-following inverter: boost stage, sinusoidal PWM, output filter and an analogue phase-locked loop that synchronises to the grid"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "argmax-w" }]
keywords = ["power-electronics", "inverter", "phase-locked-loop", "pwm", "simulation"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.6",
    "nbconvert>=7",
    "ipykernel>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/invertermodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
