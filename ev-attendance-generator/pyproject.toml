[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evattendance"
version = "0.1.0"
description = "Synthetic car-park EV charging-demand profiles from a behavioural arrival/departure model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "argmax-w" }]
keywords = ["electric-vehicles", "charging", "demand-modelling", "load-profile"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "nbconvert>=7",
    "ipykernel>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evattendance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
