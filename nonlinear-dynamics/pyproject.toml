[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nldynamics"
version = "0.1.0"
description = "Nonlinear-dynamics experiments: logistic-map bifurcation and Lyapunov exponents, escape-time Mandelbrot rendering and a Kuramoto model of cicada chorus synchronisation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "argmax-w" }]
keywords = ["nonlinear-dynamics", "chaos", "logistic-map", "mandelbrot", "kuramoto"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "nbconvert>=7",
    "ipykernel>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nldynamics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
