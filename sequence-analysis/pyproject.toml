[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seqanalysis"
version = "0.1.0"
description = "Symmetrical-component and harmonic-sequence analysis of three-phase battery telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "argmax-w" }]
keywords = ["power-systems", "symmetrical-components", "fault-analysis", "three-phase"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "nbconvert>=7",
    "ipykernel>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/seqanalysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
